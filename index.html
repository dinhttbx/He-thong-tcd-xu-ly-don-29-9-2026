<script id="sync-sticky-system-height">
(function(){
  function syncStickySystemHeight(){
    var header=document.querySelector('.sticky-system-header');
    if(!header) return;
    var h=Math.ceil(header.getBoundingClientRect().height);
    document.documentElement.style.setProperty('--sticky-system-height',h+'px');
  }
  function init(){
    syncStickySystemHeight();
    var header=document.querySelector('.sticky-system-header');
    if(window.ResizeObserver && header){
      new ResizeObserver(syncStickySystemHeight).observe(header);
    }
    window.addEventListener('resize',syncStickySystemHeight);
    window.addEventListener('load',syncStickySystemHeight);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>

            const dangXuLyDonThu = dsPhanAnh.filter(i => i.nguonDon && i.nguonDon !== 'Trực tiếp TCD' && i.trangThai === 'DangXuLy').length;

            const quaHan = listQuaHan.length;

            const quaHanDonThu = listQuaHan.filter(i => i.nguonDon && i.nguonDon !== 'Trực tiếp TCD').length;

            // ===== SỐ LIỆU DASHBOARD & SO SÁNH CÙNG KỲ =====
            // So sánh theo ngày tiếp nhận: từ 01/01 đến cùng ngày của năm trước.
            const todayDashboard = new Date();
            const currentYearDashboard = todayDashboard.getFullYear();
            const currentDayOfYearDashboard = Math.floor((todayDashboard - new Date(currentYearDashboard, 0, 1)) / 86400000);
            const samePeriodStartDashboard = new Date(currentYearDashboard - 1, 0, 1);
            const samePeriodEndDashboard = new Date(currentYearDashboard - 1, 0, 1 + currentDayOfYearDashboard);

            const isInSamePeriodDashboard = (item) => {
                if (!item?.ngayTiep) return false;
                const d = new Date(item.ngayTiep + 'T00:00:00');
                return !Number.isNaN(d.getTime()) && d >= samePeriodStartDashboard && d <= samePeriodEndDashboard;
            };

            const currentPeriodStartDashboard = new Date(currentYearDashboard, 0, 1);
            const currentPeriodEndDashboard = todayDashboard;
            const isInCurrentPeriodDashboard = (item) => {
                if (!item?.ngayTiep) return false;
                const d = new Date(item.ngayTiep + 'T00:00:00');
                return !Number.isNaN(d.getTime()) && d >= currentPeriodStartDashboard && d <= currentPeriodEndDashboard;
            };

            const currentPeriodDataDashboard = dsPhanAnh.filter(isInCurrentPeriodDashboard);
            const samePeriodDataDashboard = dsPhanAnh.filter(isInSamePeriodDashboard);
            const currentPeriodTiepDan = currentPeriodDataDashboard.filter(i => i.nguonDon === 'Trực tiếp TCD' || !i.nguonDon).length;
            const currentPeriodDonThu = currentPeriodDataDashboard.filter(i => i.nguonDon && i.nguonDon !== 'Trực tiếp TCD').length;
            const currentPeriodDangXuLy = currentPeriodDataDashboard.filter(i => i.trangThai === 'DangXuLy').length;
            const currentPeriodDaXuLy = currentPeriodDataDashboard.filter(i => i.trangThai === 'DaGiaiQuet').length;
            const todayIsoDashboard = todayDashboard.toISOString().split('T')[0];
            const currentPeriodQuaHan = currentPeriodDataDashboard.filter(i => i.trangThai === 'QuaHan' || (i.trangThai === 'DangXuLy' && i.hanXuLy && i.hanXuLy < todayIsoDashboard)).length;

            const samePeriodTiepDan = samePeriodDataDashboard.filter(i => i.nguonDon === 'Trực tiếp TCD' || !i.nguonDon).length;
            const samePeriodDonThu = samePeriodDataDashboard.filter(i => i.nguonDon && i.nguonDon !== 'Trực tiếp TCD').length;
            const samePeriodDangXuLy = samePeriodDataDashboard.filter(i => i.trangThai === 'DangXuLy').length;
            const samePeriodDaXuLy = samePeriodDataDashboard.filter(i => i.trangThai === 'DaGiaiQuet').length;
            const samePeriodQuaHan = samePeriodDataDashboard.filter(i => i.trangThai === 'QuaHan' || (i.trangThai === 'DangXuLy' && i.hanXuLy && i.hanXuLy < new Date(currentYearDashboard - 1, 0, 1 + currentDayOfYearDashboard).toISOString().split('T')[0])).length;

            const getDashboardCompare = (current, previous) => {
                const diff = current - previous;
                const percent = previous !== 0 ? (diff / previous) * 100 : null;
                return { current, previous, diff, percent };

                tiepDan: getDashboardCompare(currentPeriodTiepDan, samePeriodTiepDan),
                donThu: getDashboardCompare(currentPeriodDonThu, samePeriodDonThu),
                dangXuLy: getDashboardCompare(currentPeriodDangXuLy, samePeriodDangXuLy),
                daXuLy: getDashboardCompare(currentPeriodDaXuLy, samePeriodDaXuLy),

            // Dữ liệu biểu đồ theo 4 nhóm. Mỗi thẻ có số liệu riêng và lấy trực tiếp từ dsPhanAnh.
            const dashboardMonthlyCharts = useMemo(() => {

                const isTiepDan = (item) => item?.nguonDon === 'Trực tiếp TCD' || !item?.nguonDon;
                const isDonThu = (item) => !isTiepDan(item);

                    const d = new Date(item.ngayTiep + 'T00:00:00');
                    return !Number.isNaN(d.getTime()) && d.getFullYear() === currentYearDashboard && d.getMonth() === monthIndex;
                });

                return {
                    tiepDan: Array.from({length:12}, (_, monthIndex) => {
                        const data = byMonth(monthIndex, isTiepDan);
                        return { label:`T${monthIndex+1}`, value1:data.length, value2:data.reduce((sum,item)=>sum+Math.max(1,Number(item.soNguoi)||1),0) };

                    donThu: Array.from({length:12}, (_, monthIndex) => {

                        noiDung: item.noiDung || '',

                    });
                }

                    }

                                                        <input type="text" placeholder="Địa chỉ người gửi..." value={formDonThu.diaChiCongDan} onChange={(e) => setFormDonThu({...formDonThu, diaChiCongDan: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                                    </div>
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Loại đơn thư</label>
                                                    <select value={formDonThu.loai} onChange={(e) => setFormDonThu({...formDonThu, loai: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm">
                                                        <option value="Khiếu nại">Khiếu nại</option>
                                                        <option value="Tố cáo">Tố cáo</option>
                                                        <option value="Kiến nghị">Kiến nghị</option>
                                                        <option value="Phản ánh">Phản ánh</option>
                                                        <option value="Đơn có nhiều nội dung">Đơn có nhiều nội dung</option>
                                                    </select>
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Lĩnh vực</label>
                                                    <input type="text" placeholder="Ví dụ: Đất đai, tư pháp, xây dựng, chính sách, cán bộ..." value={formDonThu.linhVuc} onChange={(e) => setFormDonThu({...formDonThu, linhVuc: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Trích yếu nội dung đơn thư</label>
                                                    <textarea rows="4" required placeholder="Nội dung chi tiết đơn thư..." value={formDonThu.noiDung} onChange={(e) => setFormDonThu({...formDonThu, noiDung: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm"></textarea>
                                                </div>

                                                <div className="grid grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Đơn vị / Cơ quan thụ lý giải quyết</label>
                                                        <input type="text" required placeholder="Ví dụ: UBND Xã / Thanh tra..." value={formDonThu.donViGiaiQuet} onChange={(e) => setFormDonThu({...formDonThu, donViGiaiQuet: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Đính kèm tệp đơn thư (.pdf, .doc)</label>
                                                        <input type="file" accept=".doc,.docx,.pdf" onChange={(e) => handleGenericFileChange(e, 'fileDinhKem', setFormDonThu)} className="w-full text-xs p-1 border border-slate-300 rounded-lg" />
                                                        {formDonThu.fileDinhKem && <p className="text-[11px] text-emerald-600 mt-1">✓ File: {formDonThu.fileDinhKem}</p>}
                                                    </div>
                                                </div>

                                                <button type="submit" className="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-bold py-2.5 rounded-lg shadow transition text-sm uppercase mt-2">
                                                    {editingId ? 'Cập Nhật Đơn Thư' : 'Tiếp Nhận & Lưu Đơn Thư'}
                                                </button>
                                            </form>
                                        </div>
                                    )}

                                    {subTabNhapLieu === 'lichbitthu' && isUnitAccount(currentUser) && (
                                        <div>
                                            <div className="mb-5 border-b border-slate-100 pb-3">
                                                <h3 className="font-bold text-emerald-800 text-lg">Công khai Lịch Tiếp công dân định kỳ của Bí thư Đảng ủy</h3>
                                                <p className="text-xs text-slate-500">Đơn vị: {currentUser.xaName} (Quy định: Ít nhất 1 tháng tiếp 2 ngày định kỳ)</p>
                                            </div>

                                            <form onSubmit={handleSaveLichTiepBiThu} className="space-y-4">
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Số ngày tiếp định kỳ mỗi tháng</label>
                                                        <input type="number" min="1" max="10" required value={formLichTiepBiThu.soNgayQuyDinh} onChange={(e) => setFormLichTiepBiThu({...formLichTiepBiThu, soNgayQuyDinh: parseInt(e.target.value) || 2})} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Thời gian cụ thể</label>
                                                        <input type="text" required placeholder="Ví dụ: Ngày 05 và 20 hằng tháng..." value={formLichTiepBiThu.ngayTiepDinhKy} onChange={(e) => setFormLichTiepBiThu({...formLichTiepBiThu, ngayTiepDinhKy: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                                    </div>
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Địa điểm tiếp công dân</label>
                                                    <input type="text" required placeholder="Phòng Tiếp công dân Đảng ủy..." value={formLichTiepBiThu.diaDiem} onChange={(e) => setFormLichTiepBiThu({...formLichTiepBiThu, diaDiem: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Ghi chú / Quy định kèm theo</label>
                                                    <input type="text" placeholder="Tiếp định kỳ theo Quy định 11-QĐ/TW..." value={formLichTiepBiThu.ghiChu} onChange={(e) => setFormLichTiepBiThu({...formLichTiepBiThu, ghiChu: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                                </div>

                                                <div className="flex items-center space-x-2 bg-slate-50 p-3 rounded-lg border border-slate-200">
                                                    <input type="checkbox" id="chkCongKhai" checked={formLichTiepBiThu.daCongKhai} onChange={(e) => setFormLichTiepBiThu({...formLichTiepBiThu, daCongKhai: e.target.checked})} className="w-4 h-4 text-emerald-600 rounded" />
                                                    <label htmlFor="chkCongKhai" className="text-xs font-bold text-slate-700 cursor-pointer">Công khai Lịch tiếp công dân này lên hệ thống Giám sát Toàn tỉnh</label>
                                                </div>

                                                <button type="submit" className="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2.5 rounded-lg shadow transition text-sm uppercase mt-2">
                                                    Cập Nhật & Công Khai Lịch Tiếp Bí Thư
                                                </button>
                                            </form>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL PHÁT HÀNH VĂN BẢN ĐÔN ĐỐC CÓ TÍNH NĂNG CHỌN/BỎ CHỌN ĐƠN VỊ */}
                    {showDonDocModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden border border-slate-200 flex flex-col max-h-[90vh]">
                                <div className="bg-rose-700 text-white p-4 flex justify-between items-center">
                                    <h3 className="font-extrabold text-base uppercase flex items-center space-x-2">
                                        <span>📝 Phát hành Công văn Đôn đốc Quá hạn</span>
                                    </h3>
                                    <button onClick={() => setShowDonDocModal(false)} className="text-white hover:text-slate-200 font-bold text-lg px-2">✕</button>
                                </div>

                                <form onSubmit={handleSendDonDoc} className="p-6 overflow-y-auto space-y-4 flex-1">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">Số Công văn đôn đốc</label>
                                            <input type="text" required value={formDonDoc.soVanBan} onChange={e => setFormDonDoc({...formDonDoc, soVanBan: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm font-mono font-bold text-rose-700" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">Ngày ban hành</label>
                                            <input type="date" required value={formDonDoc.ngayBanHanh} onChange={e => setFormDonDoc({...formDonDoc, ngayBanHanh: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Trích yếu nội dung văn bản</label>
                                        <input type="text" required value={formDonDoc.trichYeu} onChange={e => setFormDonDoc({...formDonDoc, trichYeu: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">Hạn báo cáo kết quả</label>
                                            <input type="date" required value={formDonDoc.hanBaoCao} onChange={e => setFormDonDoc({...formDonDoc, hanBaoCao: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">Người ký / Phát hành</label>
                                            <input type="text" disabled value={currentUser.name} className="w-full p-2 border border-slate-300 rounded-lg text-sm bg-slate-100 font-bold text-slate-700" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Yêu cầu cụ thể đối với các đơn vị</label>
                                        <textarea rows="3" required value={formDonDoc.yCau} onChange={e => setFormDonDoc({...formDonDoc, yCau: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm"></textarea>
                                    </div>

                                    {/* PHẦN CHỌN/BỎ CHỌN CÁC ĐƠN VỊ NHẬN ĐÔN ĐỐC */}
                                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="text-xs font-extrabold text-slate-800 uppercase">
                                                Chọn các đơn vị nhận công văn đôn đốc ({selectedXaDonDoc.length}/{Object.keys(danhSachXaQuaHanDetails).length} được chọn):
                                            </label>
                                            <div className="space-x-2">
                                                <button 
                                                    type="button" 
                                                    onClick={() => setSelectedXaDonDoc(Object.keys(danhSachXaQuaHanDetails))}
                                                    className="text-[11px] text-indigo-700 hover:underline font-semibold"
                                                >
                                                    Chọn tất cả
                                                </button>
                                                <span className="text-slate-300">|</span>
                                                <button 
                                                    type="button" 
                                                    onClick={() => setSelectedXaDonDoc([])}
                                                    className="text-[11px] text-rose-700 hover:underline font-semibold"
                                                >
                                                    Bỏ chọn hết
                                                </button>
                                            </div>
                                        </div>
                                        <p className="text-[11px] text-slate-500 mb-3">
                                            💡 <i>Mẹo: Hệ thống tự động gợi ý bỏ chọn các đơn vị đã từng nhận văn bản đôn đốc trước đó. Bạn có thể tích chọn hoặc bỏ tích thủ công các đơn vị bên dưới.</i>
                                        </p>

                                        <div className="max-h-48 overflow-y-auto space-y-1.5 bg-white p-3 rounded-lg border border-slate-200">
                                            {Object.keys(danhSachXaQuaHanDetails).map(xa => {
                                                const isSelected = selectedXaDonDoc.includes(xa);
                                                // Kiểm tra xem xã này đã từng nhận văn bản đôn đốc nào trước đó chưa
                                                const hasSentBefore = dsVanBanDonDoc.some(vb => vb.danhSachXa && vb.danhSachXa.includes(xa));
                                                const countVuViecQuaHan = danhSachXaQuaHanDetails[xa].length;

                                                return (
                                                    <label key={xa} className={`flex items-center justify-between p-2 rounded border text-xs cursor-pointer transition ${isSelected ? 'bg-rose-50/70 border-rose-200 font-medium' : 'bg-white border-slate-100 hover:bg-slate-50'}`}>
                                                        <div className="flex items-center space-x-2">
                                                            <input 
                                                                type="checkbox"
                                                                checked={isSelected}
                                                                onChange={(e) => {
                                                                    if (e.target.checked) {
                                                                        setSelectedXaDonDoc([...selectedXaDonDoc, xa]);
                                                                    } else {
                                                                        setSelectedXaDonDoc(selectedXaDonDoc.filter(item => item !== xa));
                                                                    }
                                                                }}
                                                                className="w-4 h-4 text-rose-600 rounded"
                                                            />
                                                            <span className="font-bold text-slate-800">{xa}</span>
                                                            <span className="text-slate-500">({countVuViecQuaHan} vụ việc quá hạn)</span>
                                                        </div>
                                                        <div>
                                                            {hasSentBefore ? (
                                                                <span className="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded font-bold" title="Đơn vị này đã từng được gửi văn bản đôn đốc trước đó">
                                                                    ⚠️ Đã từng gửi ĐĐ
                                                                </span>
                                                            ) : (
                                                                <span className="bg-emerald-100 text-emerald-800 text-[10px] px-2 py-0.5 rounded font-bold">
                                                                    ✨ Chưa từng gửi ĐĐ
                                                                </span>
                                                            )}
                                                        </div>
                                                    </label>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="flex justify-end space-x-3 pt-3 border-t border-slate-200">
                                        <button type="button" onClick={() => setShowDonDocModal(false)} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-lg text-xs transition">Hủy bỏ</button>
                                        <button type="submit" className="px-5 py-2 bg-rose-700 hover:bg-rose-800 text-white font-bold rounded-lg text-xs transition shadow">Phát hành Công văn Đôn đốc ({selectedXaDonDoc.length} đơn vị)</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL ĐỔI MẬT KHẨU */}
                    {showChangePassModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl p-6 border border-slate-200">
                                <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                                    <h3 className="font-extrabold text-slate-800 text-base">🔑 Đổi mật khẩu tài khoản</h3>
                                    <button onClick={() => setShowChangePassModal(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                                </div>

                                {passMsg.text && (
                                    <div className={`mb-4 p-3 rounded-lg text-xs font-semibold text-center ${passMsg.type === 'success' ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-rose-100 text-rose-800 border border-rose-300'}`}>
                                        {passMsg.text}
                                    </div>
                                )}

                                <form onSubmit={handleChangePassword} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Mật khẩu hiện tại</label>
                                        <input type="password" required value={passForm.oldPass} onChange={e => setPassForm({...passForm, oldPass: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Mật khẩu mới (từ 6 ký tự)</label>
                                        <input type="password" required value={passForm.newPass} onChange={e => setPassForm({...passForm, newPass: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Xác nhận mật khẩu mới</label>
                                        <input type="password" required value={passForm.confirmPass} onChange={e => setPassForm({...passForm, confirmPass: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none" />
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="submit" className="flex-1 bg-red-700 hover:bg-red-800 text-white font-bold py-2.5 rounded-lg text-sm uppercase transition shadow">Xác nhận đổi</button>
                                        <button type="button" onClick={() => setShowChangePassModal(false)} className="px-4 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg text-sm transition">Đóng</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL CẬP NHẬT QUY TRÌNH XỬ LÝ VỤ VIỆC */}
                    {showProcessModal && selectedItemForProcess && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl p-6 border border-slate-200 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                                    <h3 className="font-extrabold text-slate-800 text-base">⚙️ Cập nhật Tiến độ & Kết luận Vụ việc #{selectedItemForProcess.id}</h3>
                                    <button onClick={() => setShowProcessModal(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                                </div>

                                <div className="mb-4 bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs space-y-1">
                                    <p><strong>Công dân:</strong> {selectedItemForProcess.congDan}</p>
                                    <p><strong>Nội dung:</strong> {selectedItemForProcess.noiDung}</p>
                                </div>

                                <form onSubmit={handleSaveProcess} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Bước xử lý hiện tại (5 Bước)</label>
                                        <select 
                                            value={processForm.buocXuLy} 
                                            onChange={e => {
                                                const val = parseInt(e.target.value);
                                                let tDo = processForm.tienDo;
                                                if (val === 1) tDo = 10;
                                                if (val === 2) tDo = 30;
                                                if (val === 3) tDo = 60;
                                                if (val === 4) tDo = 90;
                                                if (val === 5) tDo = 100;
                                                setProcessForm({...processForm, buocXuLy: val, tienDo: tDo});
                                            }}
                                            className="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50 font-medium"
                                        >
                                            {BUOC_XU_LY.map(b => (
                                                <option key={b.step} value={b.step}>{b.name}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Tiến độ hoàn thành (%): {processForm.tienDo}%</label>
                                        <input 
                                            type="range" min="0" max="100" step="5"
                                            value={processForm.tienDo} 
                                            onChange={e => setProcessForm({...processForm, tienDo: parseInt(e.target.value)})}
                                            className="w-full accent-indigo-600 cursor-pointer"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">Số Văn bản / Kết luận chỉ đạo</label>
                                            <input type="text" placeholder="Ví dụ: 45/KL-UBND..." value={processForm.soVanBan} onChange={e => setProcessForm({...processForm, soVanBan: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">Ngày ban hành kết luận</label>
                                            <input type="date" value={processForm.ngayKetLuan} onChange={e => setProcessForm({...processForm, ngayKetLuan: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg text-sm" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Đơn vị chịu trách nhiệm giải quyết</label>
                                        <input type="text" required value={processForm.donViGiaiQuet} onChange={e => setProcessForm({...processForm, donViGiaiQuet: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg text-sm" />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Đính kèm file Văn bản / Kết luận (.pdf, .doc)</label>
                                        <input type="file" accept=".doc,.docx,.pdf" onChange={e => handleGenericFileChange(e, 'fileSoVanBan', setProcessForm)} className="w-full text-xs p-1 border border-slate-300 rounded-lg" />
                                        {processForm.fileSoVanBan && <p className="text-[11px] text-emerald-600 mt-1">✓ File: {processForm.fileSoVanBan}</p>}
                                    </div>

                                    <div className="flex gap-2 pt-2">
                                        <button type="submit" className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg text-sm uppercase transition shadow">Lưu Cập Nhật</button>
                                        <button type="button" onClick={() => setShowProcessModal(false)} className="px-4 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg text-sm transition">Đóng</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
